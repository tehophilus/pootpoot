<!doctype html>
<html lang="en">
  <head>
    <title>Model Viewer</title>
    <meta charset="utf-8">
    <meta name="description" content="Model Viewer">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link type="text/css" href="./styles.css" rel="stylesheet"/>
  </head>

  <body>
    <model-viewer
      id="gear"
      src="model_animation.glb"
      ar
      ar-modes="webxr scene-viewer quick-look"
      camera-controls
      tone-mapping="neutral"
      poster="poster.png"
      shadow-intensity="1">

      <div class="progress-bar hide" slot="progress-bar">
        <div class="update-bar"></div>
      </div>

      <button slot="ar-button" id="ar-button">
        View in your space
      </button>

      <div id="ar-prompt">
        <img src="ar_hand_prompt.png">
      </div>

      <!-- Animation Button -->
      <div style="position:absolute; bottom:0px; right:0px">
        <button onClick="playModel()">click to play</button>
      </div>

    </model-viewer>

    <!-- Animation Function -->
    <script>
      function playModel()
      {
        document.getElementById('gear').play({
          repetitions: 0,
          pingpong: true
        });
      }
    </script>

    <script src="script.js"></script>

    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.4.0/model-viewer.min.js"></script>

  </body>
</html>
